  /api/tickets:
    post:
      tags:
      - tickets
      summary: Submit Ticket
      operationId: submit_ticket_api_tickets_post
      parameters:
      - name: X-Max-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Max-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTicketIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - tickets
      summary: List Tickets
      operationId: list_tickets_api_tickets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: role
        in: query
        required: true
        schema:
          type: string
          description: org|resident
          title: Role
        description: org|resident
      - name: X-Max-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Max-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketOut'
                title: Response List Tickets Api Tickets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tickets/{ticket_id}:
    get:
      tags:
      - tickets
      summary: Get Ticket
      operationId: get_ticket_api_tickets__ticket_id__get
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tickets/{ticket_id}/accept:
    post:
      tags:
      - tickets
      summary: Accept Ticket
      operationId: accept_ticket_api_tickets__ticket_id__accept_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tickets/{ticket_id}/assign:
    post:
      tags:
      - tickets
      summary: Assign Ticket
      operationId: assign_ticket_api_tickets__ticket_id__assign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tickets/{ticket_id}/complete:
    post:
      tags:
      - tickets
      summary: Complete Ticket
      operationId: complete_ticket_api_tickets__ticket_id__complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tickets/{ticket_id}/cancel:
    post:
      tags:
      - tickets
      summary: Cancel Ticket
      operationId: cancel_ticket_api_tickets__ticket_id__cancel_post
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      - name: X-Max-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Max-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/specialists:
    get:
      tags:
      - specialists
      summary: List Specialists
      operationId: list_specialists_api_specialists_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organizationId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Organizationid
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Active Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecialistOut'
                title: Response List Specialists Api Specialists Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - specialists
      summary: Create Specialist
      operationId: create_specialist_api_specialists_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/specialists/{specialist_id}:
    patch:
      tags:
      - specialists
      summary: Update Specialist
      operationId: update_specialist_api_specialists__specialist_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: specialist_id
        in: path
        required: true
