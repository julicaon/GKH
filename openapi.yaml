  /api/bot/webhook:
    post:
      tags:
      - bot
      summary: Bot Webhook
      operationId: bot_webhook_api_bot_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Bot Webhook Api Bot Webhook Post
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AnswerSnapshotOut:
      properties:
        questionId:
          type: string
          title: Questionid
        questionLabel:
          type: string
          title: Questionlabel
        optionId:
          type: string
          title: Optionid
        optionLabel:
          type: string
          title: Optionlabel
        optionCode:
          type: string
          title: Optioncode
      type: object
      required:
      - questionId
      - questionLabel
      - optionId
      - optionLabel
      - optionCode
      title: AnswerSnapshotOut
    AssignIn:
      properties:
        specialistId:
          type: string
          title: Specialistid
      type: object
      required:
      - specialistId
      title: AssignIn
    BuildingCategoriesOut:
      properties:
        building:
          $ref: '#/components/schemas/BuildingOut'
        tree:
          items:
            $ref: '#/components/schemas/CategoryTreeNode'
          type: array
          title: Tree
      type: object
      required:
      - building
      - tree
      title: BuildingCategoriesOut
    BuildingOut:
      properties:
        id:
          type: string
          title: Id
        addressLabel:
          type: string
          title: Addresslabel
        organizationId:
          type: string
          title: Organizationid
        availableParentCategoryIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Availableparentcategoryids
        availableCategoryIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Availablecategoryids
      type: object
      required:
      - id
      - addressLabel
      - organizationId
      title: BuildingOut
    CategoryIn:
      properties:
        parentCategoryId:
          type: string
          title: Parentcategoryid
        name:
          type: string
          title: Name
        order:
          type: integer
          title: Order
          default: 0
        active:
          type: boolean
          title: Active
          default: true
        defaultRecommendationText:
          type: string
          title: Defaultrecommendationtext
          default: ''
        defaultUrgency:
          $ref: '#/components/schemas/UrgencyLevel'
          default: MEDIUM
        organizationIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Organizationids
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - parentCategoryId
      - name
      title: CategoryIn
    CategoryOut:
      properties:
        id:
          type: string
          title: Id
        parentCategoryId:
          type: string
          title: Parentcategoryid
        name:
          type: string
          title: Name
        active:
          type: boolean
          title: Active
        order:
          type: integer
          title: Order
        defaultRecommendationText:
          type: string
          title: Defaultrecommendationtext
        defaultUrgency:
          $ref: '#/components/schemas/UrgencyLevel'
        organizationIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Organizationids
      type: object
      required:
      - id
      - parentCategoryId
      - name
      - active
      - order
      - defaultRecommendationText
      - defaultUrgency
      title: CategoryOut
    CategoryTreeNode:
      properties:
        parent:
          $ref: '#/components/schemas/ParentCategoryOut'
        categories:
          items:
            $ref: '#/components/schemas/CategoryOut'
          type: array
          title: Categories
      type: object
      required:
      - parent
      - categories
      title: CategoryTreeNode
    CategoryUpdateIn:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
        order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Order
        defaultRecommendationText:
          anyOf:
          - type: string
          - type: 'null'
          title: Defaultrecommendationtext
        defaultUrgency:
          anyOf:
          - $ref: '#/components/schemas/UrgencyLevel'
          - type: 'null'
        organizationIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Organizationids
      type: object
      title: CategoryUpdateIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        dispatcher_id:
          type: string
          title: Dispatcher Id
        organization_id:
          type: string
          title: Organization Id
        username:
          type: string
          title: Username
        full_name:
          type: string
          title: Full Name
          default: ''
      type: object
      required:
      - access_token
      - dispatcher_id
      - organization_id
      - username
      title: LoginResponse
    OptionIn:
      properties:
        label:
          type: string
          title: Label
        code:
          type: string
          title: Code
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - label
      - code
      title: OptionIn
    OptionOut:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        code:
          type: string
          title: Code
      type: object
      required:
      - id
      - label
      - code
      title: OptionOut
    ParentCategoryIn:
      properties:
        name:
          type: string
          title: Name
        order:
          type: integer
          title: Order
          default: 0
        active:
          type: boolean
          title: Active
          default: true
        defaultUrgencyHint:
          $ref: '#/components/schemas/UrgencyLevel'
          default: MEDIUM
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - name
      title: ParentCategoryIn
    ParentCategoryOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        order:
          type: integer
          title: Order
        active:
          type: boolean
          title: Active
        defaultUrgencyHint:
          $ref: '#/components/schemas/UrgencyLevel'
      type: object
      required:
      - id
      - name
      - order
      - active
      - defaultUrgencyHint
      title: ParentCategoryOut
    QuestionIn:
      properties:
        categoryId:
          type: string
          title: Categoryid
        text:
          type: string
          title: Text
        order:
          type: integer
          title: Order
          default: 0
        active:
          type: boolean
          title: Active
          default: true
        options:
          items:
            $ref: '#/components/schemas/OptionIn'
          type: array
          title: Options
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - categoryId
      - text
      title: QuestionIn
    QuestionOut:
      properties:
        id:
          type: string
          title: Id
        categoryId:
          type: string
          title: Categoryid
        text:
          type: string
          title: Text
        order:
          type: integer
          title: Order
        active:
          type: boolean
          title: Active
        options:
          items:
            $ref: '#/components/schemas/OptionOut'
          type: array
          title: Options
      type: object
      required:
      - id
      - categoryId
      - text
      - order
      - active
      - options
      title: QuestionOut
    QuestionnaireOut:
      properties:
        category:
          $ref: '#/components/schemas/CategoryOut'
        parent:
          anyOf:
          - $ref: '#/components/schemas/ParentCategoryOut'
          - type: 'null'
        questions:
          items:
            $ref: '#/components/schemas/QuestionOut'
          type: array
          title: Questions
        rules:
          items:
            $ref: '#/components/schemas/RuleOut'
          type: array
          title: Rules
      type: object
      required:
      - category
      - questions
      - rules
      title: QuestionnaireOut
    RuleIn:
      properties:
        categoryId:
          type: string
          title: Categoryid
        match:
          additionalProperties:
            type: string
          type: object
          title: Match
        recommendationText:
          type: string
          title: Recommendationtext
        priority:
          type: integer
          title: Priority
        active:
          type: boolean
          title: Active
          default: true
        setsUrgency:
          anyOf:
          - $ref: '#/components/schemas/UrgencyLevel'
          - type: 'null'
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - categoryId
      - match
      - recommendationText
      - priority
      title: RuleIn
